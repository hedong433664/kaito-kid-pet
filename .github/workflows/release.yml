name: Build and publish release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Build jobs need read access only; the release job opts into write access.
permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
  ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/

jobs:
  validate:
    name: Validate project and version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Check tag and lockfile versions
        run: node scripts/validate-release.mjs
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build renderer
        run: npm run build

  build-windows:
    name: Windows x64 installer
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Windows package without publishing
        run: npm run dist:win -- --publish never
      - name: Verify Windows artifacts
        run: node scripts/validate-release.mjs --artifacts windows
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kaito-kid-pet-windows
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true
          path: |
            release/kaito-kid-pet Setup *.exe
            release/kaito-kid-pet Setup *.exe.blockmap
            release/latest.yml

  build-macos:
    name: macOS arm64 and x64 packages
    needs: validate
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build macOS packages without publishing
        run: npm run dist:mac -- --publish never
      - name: Verify both macOS architectures
        run: node scripts/validate-release.mjs --artifacts macos
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kaito-kid-pet-macos
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac*.yml

  publish:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-windows
      - build-macos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kaito-kid-pet-windows
          path: release-assets
      - name: Download macOS artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kaito-kid-pet-macos
          path: release-assets
      - name: Upload all installers before publishing the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release-assets/*)
          if (( ${#assets[@]} == 0 )); then
            echo '::error::No release files were downloaded.'
            exit 1
          fi
          if gh release view "$TAG_NAME" --json isDraft --jq '.isDraft' > release-state.txt; then
            if [[ "$(cat release-state.txt)" != "true" ]]; then
              echo '::error::This version is already published. Use a new version/tag instead of overwriting a public release.'
              exit 1
            fi
          else
            prerelease=()
            if [[ "$TAG_NAME" == *-* ]]; then prerelease=(--prerelease); fi
            gh release create "$TAG_NAME" --verify-tag --draft \
              --title "kaito-kid-pet $TAG_NAME" --generate-notes "${prerelease[@]}"
          fi
          gh release upload "$TAG_NAME" "${assets[@]}" --clobber
          gh release edit "$TAG_NAME" --draft=false
